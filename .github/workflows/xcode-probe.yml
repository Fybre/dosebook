name: Probe Xcode versions
on: workflow_dispatch
jobs:
  probe:
    name: Xcode ${{ matrix.xcode }} ${{ matrix.extra }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { xcode: '26.0', extra: '' }
          - { xcode: '26.2', extra: '' }
          - { xcode: '26.4', extra: '' }
          - { xcode: '26.5', extra: '' }
          - { xcode: '26.6', extra: 'SWIFT_COMPILATION_MODE=wholemodule' }
          - { xcode: '26.6', extra: '-configuration Release' }
    steps:
      - uses: actions/checkout@v4
      - run: sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer && xcodebuild -version
      - run: brew install xcodegen && xcodegen generate
      - run: |
          xcodebuild -project Bench.xcodeproj -scheme Bench -destination 'generic/platform=iOS Simulator' ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO ${{ matrix.extra }} build > build.log 2>&1 || true
          grep -a -E "error:|BUILD (SUCCEEDED|FAILED)" build.log | head -5

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.tz }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      # The dose maths is local time, so it is tested in several zones, one with daylight saving
      # in the other hemisphere and one with a half-hour offset.
      matrix:
        tz: [America/New_York, Europe/London, Asia/Kolkata, Australia/Sydney]
    steps:
      - uses: actions/checkout@v4
      - name: Test BenchCore
        env:
          TZ: ${{ matrix.tz }}
        run: swift test --package-path BenchCore

  build:
    name: Build apps (unsigned)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest stable Xcode
        id: xcode
        run: |
          latest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -vi beta | sort -V | tail -1)
          [ -n "$latest" ] && sudo xcode-select -s "$latest/Contents/Developer"
          xcodebuild -version
          major=$(xcodebuild -version | awk '/^Xcode/ {print $2}' | cut -d. -f1)
          # The app currently needs the compiler in Xcode 27: Swift 6.2, in Xcode 26.x, crashes while
          # generating code for it (tried on 26.2 to 26.6). Until the runners have Xcode 27, the build
          # is skipped rather than failed. The tests above do not depend on it.
          if [ "${major:-0}" -ge 27 ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=App build skipped::The runner has Xcode ${major}; the apps need Xcode 27 or later."
          fi

      - name: Install XcodeGen
        if: steps.xcode.outputs.ok == 'true'
        run: brew install xcodegen

      - name: Generate the project
        if: steps.xcode.outputs.ok == 'true'
        run: xcodegen generate

      - name: Build the iPhone and iPad app
        if: steps.xcode.outputs.ok == 'true'
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -project Bench.xcodeproj -scheme Bench \
            -destination 'generic/platform=iOS Simulator' ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build 2>&1 | tee "$RUNNER_TEMP/ios-build.log" | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" "$RUNNER_TEMP/ios-build.log"

      - name: Build the Mac app
        if: steps.xcode.outputs.ok == 'true'
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -project Bench.xcodeproj -scheme BenchMac \
            -destination 'platform=macOS' ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 | tee "$RUNNER_TEMP/mac-build.log" | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" "$RUNNER_TEMP/mac-build.log"

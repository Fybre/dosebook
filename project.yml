name: Bench
options:
  bundleIdPrefix: me.fybre
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    # Signing team. Settle the app's name before the first signed build: automatic
    # signing then registers the bundle id and creates the iCloud container, and a
    # container can never be deleted or renamed.
    DEVELOPMENT_TEAM: "8BD49F6FX5"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  BenchCore:
    path: BenchCore
targets:
  Bench:
    type: application
    platform: iOS
    sources:
      - path: Bench
    dependencies:
      - package: BenchCore
        product: BenchCore
      - package: BenchCore
        product: BenchStore
    entitlements:
      path: Bench/Bench.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers: [iCloud.me.fybre.bench]
        com.apple.developer.icloud-services: [CloudKit]
        aps-environment: development
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    info:
      path: Bench/Info.plist
      properties:
        CFBundleDisplayName: Bench
        UILaunchScreen: {}
        UIBackgroundModes: [remote-notification]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown,
           UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSHealthShareUsageDescription: "Bench reads your weight, sleep and resting heart rate so they can sit beside your doses and check-ins. Nothing is ever written back."
        NSCameraUsageDescription: "Bench reads a vial's label to fill in the compound, strength, lot and expiry. The photo is read on this iPhone and not kept."
        ITSAppUsesNonExemptEncryption: false
        # Documents/Bench, where automatic backups go, shows in Files under On My iPhone.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UTImportedTypeDeclarations: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.fybre.bench
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"

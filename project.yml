name: Bench
options:
  bundleIdPrefix: me.fybre
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    # No team here: the release target stays unsigned until its name is settled,
    # because its first signed build creates an iCloud container, which can never
    # be deleted or renamed. The BenchTest target carries the team instead.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  BenchCore:
    path: BenchCore
targets:
  Bench:
    type: application
    scheme: {}
    platform: iOS
    sources:
      - path: Bench
        excludes: [Info-Test.plist, BenchTest.entitlements]
      - path: Shared
      - path: Widgets
        includes: [WidgetViews.swift]
    dependencies:
      - package: BenchCore
        product: BenchCore
      - package: BenchCore
        product: BenchStore
    entitlements:
      path: Bench/Bench.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers: [iCloud.me.fybre.dosebook]
        com.apple.developer.icloud-services: [CloudKit]
        aps-environment: development
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    info:
      path: Bench/Info.plist
      properties:
        CFBundleDisplayName: Dosebook
        UILaunchScreen: {}
        UIBackgroundModes: [remote-notification]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown,
           UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSHealthShareUsageDescription: "Dosebook reads your weight, sleep and resting heart rate so they can sit beside your doses and check-ins. Nothing is ever written back."
        NSFaceIDUsageDescription: "Dosebook asks for Face ID to open, when you have turned the lock on."
        NSCameraUsageDescription: "Dosebook reads vial labels and bloodwork results from photos. Photos are read on this iPhone and not kept."
        ITSAppUsesNonExemptEncryption: false
        # Documents/Dosebook, where automatic backups go, shows in Files under On My iPhone.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UTImportedTypeDeclarations: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.fybre.dosebook
        DEVELOPMENT_TEAM: "8BD49F6FX5"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
  # A test build for real devices: its own bundle id, no iCloud (nothing permanent
  # in the Apple account), data on the phone only. Moves to the release app later
  # through an exported backup.
  BenchTest:
    type: application
    scheme: {}
    platform: iOS
    sources:
      - path: Bench
        excludes: [Info.plist, Bench.entitlements]
      - path: Shared
      - path: Widgets
        includes: [WidgetViews.swift]
    dependencies:
      - package: BenchCore
        product: BenchCore
      - package: BenchCore
        product: BenchStore
      # Widgets are off until an App Group is registered for the account (it makes a
      # permanent identifier, so it waits on the name). To turn them on: add
      # `- target: BenchWidgets` here and
      # `com.apple.security.application-groups: [group.me.fybre.dosebook.test]` below,
      # and register that group. See PLAN.md.
    entitlements:
      path: Bench/BenchTest.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    info:
      path: Bench/Info-Test.plist
      properties:
        CFBundleDisplayName: Dosebook Test
        BenchAppGroup: group.me.fybre.dosebook.test
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown,
           UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSHealthShareUsageDescription: "Dosebook reads your weight, sleep and resting heart rate so they can sit beside your doses and check-ins. Nothing is ever written back."
        NSFaceIDUsageDescription: "Dosebook asks for Face ID to open, when you have turned the lock on."
        NSCameraUsageDescription: "Dosebook reads vial labels and bloodwork results from photos. Photos are read on this iPhone and not kept."
        ITSAppUsesNonExemptEncryption: false
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UTImportedTypeDeclarations: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.fybre.dosebook.test
        DEVELOPMENT_TEAM: "8BD49F6FX5"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) LOCAL_ONLY"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
  # The Mac app, on the same test track as BenchTest: local data only, no iCloud
  # and no team, signed only to run on this Mac. It shares every view with iOS.
  BenchTestMac:
    type: application
    scheme: {}
    platform: macOS
    sources:
      - path: Bench
        excludes: [Info.plist, Info-Test.plist, Bench.entitlements, BenchTest.entitlements]
      - path: Shared
    dependencies:
      - package: BenchCore
        product: BenchCore
      - package: BenchCore
        product: BenchStore
    info:
      path: MacSupport/Info.plist
      properties:
        CFBundleDisplayName: Dosebook Test
        CFBundleName: Dosebook Test
        LSApplicationCategoryType: public.app-category.healthcare-fitness
        NSCameraUsageDescription: "Dosebook reads vial labels and bloodwork results from photos. Photos are read on this Mac and not kept."
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.fybre.dosebook.test
        PRODUCT_NAME: Dosebook Test
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) LOCAL_ONLY"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  # The Mac release app: sandboxed, signed with the team, and entitled to the same iCloud
  # container as the iPhone app, so the two sync. No LOCAL_ONLY, so it uses iCloud when
  # the Mac is signed in. Shares every view with iOS.
  BenchMac:
    type: application
    scheme: {}
    platform: macOS
    sources:
      - path: Bench
        excludes: [Info.plist, Info-Test.plist, Bench.entitlements, BenchTest.entitlements]
      - path: Shared
    dependencies:
      - package: BenchCore
        product: BenchCore
      - package: BenchCore
        product: BenchStore
    entitlements:
      path: MacSupport/Dosebook.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.device.camera: true
        com.apple.developer.icloud-container-identifiers: [iCloud.me.fybre.dosebook]
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.developer.aps-environment: development
    info:
      path: MacSupport/Info-Release.plist
      properties:
        CFBundleDisplayName: Dosebook
        CFBundleName: Dosebook
        LSApplicationCategoryType: public.app-category.healthcare-fitness
        NSCameraUsageDescription: "Dosebook reads vial labels and bloodwork results from photos. Photos are read on this Mac and not kept."
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.fybre.dosebook
        PRODUCT_NAME: Dosebook
        DEVELOPMENT_TEAM: "8BD49F6FX5"
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  # The Home Screen and Lock Screen widget: the next dose, today's ring, and a Log
  # button. Test build only; the release app gets one when its name is settled.
  BenchWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
        excludes: [BenchWidgets.entitlements]
      - path: Shared
    entitlements:
      path: Widgets/BenchWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.me.fybre.dosebook.test]
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Dosebook Test
        BenchAppGroup: group.me.fybre.dosebook.test
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.fybre.dosebook.test.widgets
        DEVELOPMENT_TEAM: "8BD49F6FX5"
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES

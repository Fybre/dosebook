name: Bench
options:
  bundleIdPrefix: me.fybre
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    # No team here: the release target stays unsigned until its name is settled,
    # because its first signed build creates an iCloud container, which can never
    # be deleted or renamed. The BenchTest target carries the team instead.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  BenchCore:
    path: BenchCore
targets:
  Bench:
    type: application
    scheme: {}
    platform: iOS
    sources:
      - path: Bench
        excludes: [Info-Test.plist, BenchTest.entitlements]
    dependencies:
      - package: BenchCore
        product: BenchCore
      - package: BenchCore
        product: BenchStore
    entitlements:
      path: Bench/Bench.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers: [iCloud.me.fybre.bench]
        com.apple.developer.icloud-services: [CloudKit]
        aps-environment: development
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    info:
      path: Bench/Info.plist
      properties:
        CFBundleDisplayName: Bench
        UILaunchScreen: {}
        UIBackgroundModes: [remote-notification]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown,
           UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSHealthShareUsageDescription: "Bench reads your weight, sleep and resting heart rate so they can sit beside your doses and check-ins. Nothing is ever written back."
        NSCameraUsageDescription: "Bench reads vial labels and bloodwork results from photos. Photos are read on this iPhone and not kept."
        ITSAppUsesNonExemptEncryption: false
        # Documents/Bench, where automatic backups go, shows in Files under On My iPhone.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UTImportedTypeDeclarations: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.fybre.bench
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
  # A test build for real devices: its own bundle id, no iCloud (nothing permanent
  # in the Apple account), data on the phone only. Moves to the release app later
  # through an exported backup.
  BenchTest:
    type: application
    scheme: {}
    platform: iOS
    sources:
      - path: Bench
        excludes: [Info.plist, Bench.entitlements]
    dependencies:
      - package: BenchCore
        product: BenchCore
      - package: BenchCore
        product: BenchStore
    entitlements:
      path: Bench/BenchTest.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    info:
      path: Bench/Info-Test.plist
      properties:
        CFBundleDisplayName: Bench Test
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown,
           UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSHealthShareUsageDescription: "Bench reads your weight, sleep and resting heart rate so they can sit beside your doses and check-ins. Nothing is ever written back."
        NSCameraUsageDescription: "Bench reads vial labels and bloodwork results from photos. Photos are read on this iPhone and not kept."
        ITSAppUsesNonExemptEncryption: false
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UTImportedTypeDeclarations: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.fybre.bench.test
        DEVELOPMENT_TEAM: "8BD49F6FX5"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) LOCAL_ONLY"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
  # The Mac app, on the same test track as BenchTest: local data only, no iCloud
  # and no team, signed only to run on this Mac. It shares every view with iOS.
  BenchTestMac:
    type: application
    scheme: {}
    platform: macOS
    sources:
      - path: Bench
        excludes: [Info.plist, Info-Test.plist, Bench.entitlements, BenchTest.entitlements]
    dependencies:
      - package: BenchCore
        product: BenchCore
      - package: BenchCore
        product: BenchStore
    info:
      path: MacSupport/Info.plist
      properties:
        CFBundleDisplayName: Bench Test
        CFBundleName: Bench Test
        LSApplicationCategoryType: public.app-category.healthcare-fitness
        NSCameraUsageDescription: "Bench reads a vial's label to fill in the compound, strength, lot and expiry. The photo is read on this Mac and not kept."
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.fybre.bench.test
        PRODUCT_NAME: Bench Test
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) LOCAL_ONLY"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
